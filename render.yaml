# Render Blueprint for the LearnLens / Eduvia Django API.
# Render reads this file from the repository root: Dashboard -> New -> Blueprint -> pick this repo.
# Commands run from the repo root because the API imports packages/ai-engine from outside apps/django-api.
services:
  - type: web
    name: learnlens-backend
    runtime: python
    region: singapore # pick the region closest to your students (oregon, ohio, virginia, frankfurt, singapore)
    plan: free # free sleeps after 15 min idle (first request then takes ~30-50 s); "starter" stays awake
    buildCommand: >-
      pip install -r requirements.txt &&
      cd apps/django-api &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input
    # gthread workers keep serving while AI and voice calls wait on Groq/Gemini (up to ~60 s).
    startCommand: >-
      cd apps/django-api &&
      gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
      --worker-class gthread --workers 2 --threads 4 --timeout 90
    healthCheckPath: /health/
    autoDeploy: true
    buildFilter:
      paths:
        - apps/django-api/**
        - packages/**
        - requirements.txt
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Your Vercel URL(s), comma-separated, e.g. https://learnlens.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: FIREBASE_STUB_MODE
        value: "True"
      - key: FIREBASE_PROJECT_ID
        value: "gen-lang-client-0427554587"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # AI providers (AI tutor, open practice, teacher insights, voice transcription)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GEMINI_API_KEY
        sync: false
      # Text-to-speech proxy
      - key: CARTESIA_API_KEY
        sync: false
      # Signed uploads for Self Study notes (secret stays server-side)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        value: "notes-portal"
      # Optional: only the legacy ai_engine client uses OpenAI
      - key: OPENAI_API_KEY
        sync: false
