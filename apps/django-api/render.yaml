services:
  - type: web
    name: learnlens-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: "/health/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: FIREBASE_STUB_MODE
        value: "True"
      - key: FIREBASE_PROJECT_ID
        value: "gen-lang-client-0427554587"
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
